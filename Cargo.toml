[package]
name = "datakit"
version = "0.2.0"
edition = "2021"
description = "Data transformation and ETL toolkit for the Phenotype ecosystem"
authors = ["KooshaPari"]
license = "MIT"
repository = "https://github.com/KooshaPari/DataKit"
keywords = ["etl", "data-pipeline", "transform", "phenotype"]
categories = ["data-structures", "database-implementations"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

[dev-dependencies]
tempfile = "3"

[lib]
name = "datakit"
path = "src/lib.rs"

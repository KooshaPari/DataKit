[trace-gate]
# Trace Gate configuration for DataKit
# Minimum FR coverage requirement for deployment gates

coverage-minimum = 0.75
strict-mode = true

[exemptions]
# Test files and mock utilities are exempt from FR traceability
patterns = [
  "**/tests/**",
  "**/test/**",
  "**/*_test.py",
  "**/*_mock.py",
  "**/conftest.py"
]

[deployment]
# Enforce FR coverage gates on PR merges
required = true
gate-percentage = 75
